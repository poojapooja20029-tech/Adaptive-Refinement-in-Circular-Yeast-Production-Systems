<!DOCTYPE html>
<html>

<head>
    <title>Biomass Prediction</title>
</head>

<body>

    <h1>Yeast Biomass Prediction</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Temperature (°C)</label>
        <input type="number" step="0.1" name="temperature" required>

        <br><br>

        <label>pH</label>
        <input type="number" step="0.1" name="ph" required>

        <br><br>

        <label>Sugar Concentration (g/L)</label>
        <input type="number" step="0.1" name="sugar" required>

        <br><br>

        <button type="submit">Predict Biomass</button>

    </form>

    {% if prediction %}
        <h2>Predicted Biomass: {{ prediction }} g/L</h2>
    {% endif %}

</body>

</html>
